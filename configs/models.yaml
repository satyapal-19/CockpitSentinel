# Model registry — paths dynamically resolve via COCKPIT_MODELS_ROOT or local models directory

pretrained:
  face_landmarker:
    path: "{models_root}/pretrained/face_landmarker.task"
    source: mediapipe
    purpose: face landmarks for fatigue and attention signals
  yolov8n:
    path: "{models_root}/pretrained/yolov8n.pt"
    source: ultralytics
    purpose: cell-phone detection
  yolov8s-worldv2:
    path: "{models_root}/pretrained/yolov8s-worldv2.pt"
    source: ultralytics
    purpose: text-prompted smoking-related object detection

trained:
  yolo11s_distraction:
    path: "{models_root}/trained/yolo11s_distraction/best.pt"
    openvino_path: "{models_root}/trained/yolo11s_distraction/best_openvino_model"
    onnx_path: "{models_root}/trained/yolo11s_distraction/best.onnx"
    source: ultralytics-yolo11
    purpose: unified phone and smoking distraction detection

  yolo11s_balanced_distraction:
    path: "{models_root}/trained/yolo11s_balanced_distraction/best.pt"
    openvino_path: "{models_root}/trained/yolo11s_balanced_distraction/best_openvino_model"
    onnx_path: "{models_root}/trained/yolo11s_balanced_distraction/best.onnx"
    source: ultralytics-yolo11
    purpose: high-precision balanced phone and smoking distraction detection

  yolo11s_coordatt:
    path: "{models_root}/trained/yolo11s_coordatt/best.pt"
    openvino_path: "{models_root}/trained/yolo11s_coordatt/best_openvino_model"
    source: ultralytics-yolo11-coordatt
    purpose: state-of-the-art coordinate-attention driver distraction detection (96.3% phone precision)

  yolo11_smoking:
    path: "{models_root}/trained/yolo11_smoking/best.pt"
    openvino_path: "{models_root}/trained/yolo11_smoking/best_openvino_model"
    onnx_path: "{models_root}/trained/yolo11_smoking/best.onnx"
    source: ultralytics-yolo11
    purpose: specialized smoking, cigarette, and face detection fine-tuned on custom smoking dataset

